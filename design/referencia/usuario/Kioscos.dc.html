<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { zone: 'all' };
}
renderVals() {
const all = [
{ name: 'Kiosco El Faro 24 hs', zone: 'San Miguel', z: 'sm', time: '20–30 min', fee: '$1.800' },
{ name: 'Kiosco 24 Paunero', zone: 'San Miguel', z: 'sm', time: '25–35 min', fee: '$1.800' },
{ name: 'Maxikiosco Muñiz', zone: 'Muñiz', z: 'mu', time: '15–25 min', fee: '$1.600' },
{ name: 'Kiosco La Esquina', zone: 'Bella Vista', z: 'bv', time: '30–40 min', fee: '$2.000' },
{ name: 'Drugstore Senador', zone: 'Bella Vista', z: 'bv', time: '20–30 min', fee: '$2.000' }
];
const opts = [['all', 'Todas'], ['sm', 'San Miguel'], ['mu', 'Muñiz'], ['bv', 'Bella Vista']];
const zones = opts.map((o) => ({
label: o[1],
pressed: o[0] === this.state.zone ? 'true' : 'false',
bg: o[0] === this.state.zone ? '#FFD23F' : '#16306F',
fg: o[0] === this.state.zone ? '#0A1633' : '#BFD3FF',
pick: () => this.setState({ zone: o[0] })
}));
const shops = all.filter((k) => this.state.zone === 'all' || k.z === this.state.zone).map((k) => Object.assign({}, k, { initial: k.name.replace('Kiosco ', '').replace('Maxikiosco ', '').replace('Drugstore ', '').charAt(0) }));
return { zones, shops };
}
}
</script>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { q: { coca: 1, papas: 1, alfa: 2 } };
}
renderVals() {
const fmt = (n) => '$' + n.toLocaleString('es-AR');
const list = [
{ id: 'coca', name: 'Gaseosa cola 1,5 L', price: 2900 },
{ id: 'papas', name: 'Papas fritas 85 g', price: 2100 },
{ id: 'alfa', name: 'Alfajor triple', price: 900 },
{ id: 'agua', name: 'Agua sin gas 500 ml', price: 1000 },
{ id: 'hielo', name: 'Hielo 2 kg', price: 1500 },
{ id: 'gall', name: 'Galletitas rellenas', price: 1600 }
];
const q = this.state.q;
const set = (id, d) => {
const next = Object.assign({}, this.state.q);
next[id] = Math.max(0, (next[id] || 0) + d);
this.setState({ q: next });
};
let count = 0;
let sum = 0;
const items = list.map((p) => {
const n = q[p.id] || 0;
count += n;
sum += n * p.price;
return { name: p.name, priceLabel: fmt(p.price), qty: n, inc: () => set(p.id, 1), dec: () => set(p.id, -1) };
});
return { items, count, total: fmt(sum + 1800) };
}
}
</script>

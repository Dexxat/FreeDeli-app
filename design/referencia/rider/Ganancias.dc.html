<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { period: 'dia' };
}
renderVals() {
const data = {
dia: { label: 'JORNADA', caption: 'Ganancias de la jornada de hoy', total: '$14.400', pedidos: '8', promedio: '$1.800', horas: '5h 20m', envios: '$12.900', propinas: '$1.500', chartTitle: 'POR HORA', bars: [['19', 1], ['20', 2], ['21', 1], ['22', 2], ['23', 2], ['00', 0]] },
semana: { label: 'SEMANA', caption: 'Ganancias de esta semana', total: '$86.200', pedidos: '47', promedio: '$1.834', horas: '31h', envios: '$78.400', propinas: '$7.800', chartTitle: 'POR DÍA', bars: [['L', 6], ['M', 5], ['M', 7], ['J', 6], ['V', 9], ['S', 10], ['D', 4]] },
mes: { label: 'MES PASADO', caption: 'Ganancias del mes pasado', total: '$342.900', pedidos: '188', promedio: '$1.824', horas: '124h', envios: '$311.200', propinas: '$31.700', chartTitle: 'POR SEMANA', bars: [['S1', 41], ['S2', 46], ['S3', 52], ['S4', 49]] }
};
const cur = data[this.state.period];
const max = Math.max(...cur.bars.map((b) => b[1]), 1);
const last = cur.bars.length - 1;
const bars = cur.bars.map((b, i) => ({
label: b[0],
h: Math.max(4, Math.round((b[1] / max) * 100)) + 'px',
color: i === last ? '#FFD23F' : '#8FB4FF'
}));
const periods = ['dia', 'semana', 'mes'].map((k) => ({
label: data[k].label,
pressed: k === this.state.period ? 'true' : 'false',
bg: k === this.state.period ? '#FFD23F' : '#16306F',
fg: k === this.state.period ? '#0A1633' : '#BFD3FF',
pick: () => this.setState({ period: k })
}));
return Object.assign({}, cur, { bars, periods, chartAria: 'Pedidos ' + cur.chartTitle.toLowerCase() });
}
}
</script>

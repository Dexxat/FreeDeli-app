<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { on: false, sel: { sm: true, mu: false, bv: false } };
}
renderVals() {
const on = this.state.on;
const sel = this.state.sel;
const data = [
{ id: 'sm', name: 'San Miguel', pedidos: 32, riders: 9 },
{ id: 'mu', name: 'Muñiz', pedidos: 14, riders: 3 },
{ id: 'bv', name: 'Bella Vista', pedidos: 21, riders: 8 }
];
const n = data.filter((d) => sel[d.id]).length;
const maxP = Math.max(...data.map((d) => d.pedidos));
const maxR = Math.max(...data.map((d) => d.riders));
const share = n ? Math.floor(100 / n) : 0;
let rest = n ? 100 - share * n : 0;
const zones = data.map((d) => {
const s = !!sel[d.id];
let c = 0;
if (s) { c = share + (rest > 0 ? 1 : 0); if (rest > 0) rest -= 1; }
return {
name: d.name,
pedidos: d.pedidos,
riders: d.riders,
pedW: Math.round((d.pedidos / maxP) * 100) + '%',
ridW: Math.round((d.riders / maxR) * 100) + '%',
ratio: (d.pedidos / d.riders).toFixed(1).replace('.', ',') + ' pedidos por rider',
pressed: s ? 'true' : 'false',
bg: s ? '#16306F' : '#0F1F4A',
edge: s ? '#FFD23F' : '#2E5BBF',
check: s ? '#FFD23F' : 'transparent',
chance: s ? c + '%' : '—',
chanceColor: s ? '#FFD23F' : '#8FB4FF',
pick: () => {
const next = Object.assign({}, this.state.sel);
next[d.id] = !next[d.id];
if (!next.sm && !next.mu && !next.bv) return;
this.setState({ sel: next });
}
};
});
return {
zones,
toggle: () => this.setState({ on: !this.state.on }),
onStr: on ? 'true' : 'false',
btnLabel: on ? 'ON' : 'OFF',
btnHint: on ? 'En línea · buscando pedidos' : 'Tocá para conectarte (PRESS START)',
btnBg: on ? '#FFD23F' : '#16306F',
btnFg: on ? '#0A1633' : '#FFFFFF',
btnEdge: on ? '#FFB020' : '#2E5BBF',
knobSide: on ? 'flex-end' : 'flex-start',
knobColor: on ? '#FFD23F' : '#8FB4FF',
pillText: on ? 'EN LÍNEA' : 'OFFLINE',
pillBg: on ? '#FFD23F' : '#16306F',
pillFg: on ? '#0A1633' : '#BFD3FF',
pillDot: on ? '#0A1633' : '#8FB4FF'
};
}
}
</script>

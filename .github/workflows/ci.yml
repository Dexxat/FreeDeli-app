# Pruebas de FreeDeli en cada push y pull request.
#   unitarias: las cinco suites de Angular, la API (unitarias y e2e de API).
#   end-to-end: las cuatro apps en navegador contra la API real y Postgres (Playwright).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unitarias:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: freedeli_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d freedeli_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Dependencias de las apps
        run: npm ci
      - name: Pruebas de las apps
        run: |
          for p in shared usuarios-app kioscos-app riders-app dev-admin; do
            npx ng test "$p" --watch=false
          done
      - name: Dependencias de la API
        working-directory: backend
        run: npm ci --ignore-scripts && npm rebuild prisma @prisma/engines
      - name: Pruebas de la API
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/freedeli_test
        run: |
          npm test
          npm run test:e2e

  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: freedeli_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U e2e -d freedeli_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            e2e/package-lock.json
      - name: Dependencias
        run: |
          npm ci
          (cd backend && npm ci --ignore-scripts && npm rebuild prisma @prisma/engines)
          (cd e2e && npm ci --ignore-scripts)
      - name: Navegador
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Pruebas end to end
        working-directory: e2e
        env:
          CI: "true"
          DATABASE_URL: postgresql://e2e:e2e@localhost:5432/freedeli_e2e
        run: npx playwright test
      - name: Reporte
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: e2e/playwright-report/
          retention-days: 14
